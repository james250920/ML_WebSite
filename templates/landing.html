<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Detected</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Voice Detected AI</h1>
        <p>Sube un archivo de audio para analizar su autenticidad e identidad.</p>
        
        <form id="audio-form" class="main-form">
            <div class="upload-section">
                <input type="file" id="audio-file" name="audio" accept=".wav,.mp3,.ogg,.flac,.m4a,.aac,.opus,.webm,.wma" hidden onchange="updateFileName()">
                <label for="audio-file" class="upload-box">
                    <i class="fas fa-cloud-upload-alt fa-3x"></i>
                    <span class="upload-text">Arrastra tu audio aquí o haz clic para buscar</span>
                    <span id="file-name-display" class="file-name">Ningún archivo seleccionado</span>
                </label>
            </div>

            <div class="action-buttons">
                <button type="button" onclick="analyzeAudio('detect')" class="btn btn-detect">
                    <i class="fas fa-shield-alt"></i>
                    Detectar Real/Fake
                </button>
                
                <button type="button" onclick="analyzeAudio('identify')" class="btn btn-identify">
                    <i class="fas fa-user-tag"></i>
                    ¿Quién es?
                </button>
            </div>
        </form>

        <div id="modal-overlay" class="modal-overlay" style="display: none;" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div id="modal-loading" class="modal-loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Analizando audio...</p>
                    <p class="loading-subtext">Por favor espera</p>
                </div>

                <div id="modal-result" class="modal-result" style="display: none;">
                    <button class="modal-close" onclick="closeModal()">
                        <i class="fas fa-times"></i>
                    </button>
                    <div id="result-icon" class="result-icon"></div>
                    <h2 id="result-title" class="result-title">Resultado</h2>
                    <div id="result-content" class="result-content"></div>
                    <div class="modal-actions">
                        <button onclick="closeModal()" class="btn btn-primary btn-modal-action">
                            <i class="fas fa-redo"></i>
                            Analizar Nuevo Audio
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-section">
            <button onclick="convertToWav()" class="btn btn-convert">
                <i class="fas fa-file-audio"></i>
                Convertir a WAV
            </button>
            <a href="/about" class="btn btn-about">
                <i class="fas fa-info-circle"></i>
                Acerca de
            </a>
        </div>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('audio-file');
            const display = document.getElementById('file-name-display');
            if (input.files && input.files.length > 0) {
                display.textContent = input.files[0].name;
                display.classList.add('active');
            } else {
                display.textContent = 'Ningún archivo seleccionado';
                display.classList.remove('active');
            }
        }

        function analyzeAudio(action) {
            const fileInput = document.getElementById('audio-file');
            const file = fileInput.files[0];

            if (!file) {
                showModal('error', 'Error', 'Por favor, selecciona un archivo de audio primero.');
                return;
            }

            // Validar formato de archivo
            const allowedFormats = ['.wav', '.mp3', '.ogg', '.flac', '.m4a', '.aac', '.opus', '.webm', '.wma'];
            const fileName = file.name.toLowerCase();
            const isValidFormat = allowedFormats.some(format => fileName.endsWith(format));
            
            if (!isValidFormat) {
                showModal('error', 'Formato no Permitido', 'Formato de archivo no permitido. Use: wav, mp3, ogg, flac, m4a, aac, opus, webm, wma');
                return;
            }

            // Mostrar modal con loading
            showLoadingModal();

            // Crear FormData para enviar el archivo
            const formData = new FormData();
            formData.append('audio', file);
            formData.append('action', action);

            // Enviar petición AJAX
            fetch('/api/analyze', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayResult(data);
                } else {
                    showModal('error', 'Error', data.message || 'Error al procesar el audio');
                }
            })
            .catch(error => {
                showModal('error', 'Error de Conexión', 'No se pudo conectar con el servidor. Verifica que el backend esté ejecutándose en http://localhost:8000');
            });
        }

        function showLoadingModal() {
            const overlay = document.getElementById('modal-overlay');
            const loading = document.getElementById('modal-loading');
            const result = document.getElementById('modal-result');
            
            overlay.style.display = 'flex';
            loading.style.display = 'block';
            result.style.display = 'none';
        }

        function showModal(type, title, message) {
            const overlay = document.getElementById('modal-overlay');
            const loading = document.getElementById('modal-loading');
            const result = document.getElementById('modal-result');
            const resultTitle = document.getElementById('result-title');
            const resultContent = document.getElementById('result-content');
            const resultIcon = document.getElementById('result-icon');
            
            loading.style.display = 'none';
            result.style.display = 'block';
            overlay.style.display = 'flex';
            
            resultTitle.textContent = title;
            
            if (type === 'error') {
                resultIcon.innerHTML = '<i class="fas fa-exclamation-circle fa-5x" style="color: #ff416c;"></i>';
                resultContent.innerHTML = `<p class="error-message">${message}</p>`;
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            resetForm();
        }

        function displayResult(data) {
            const overlay = document.getElementById('modal-overlay');
            const loading = document.getElementById('modal-loading');
            const result = document.getElementById('modal-result');
            const resultTitle = document.getElementById('result-title');
            const resultContent = document.getElementById('result-content');
            const resultIcon = document.getElementById('result-icon');

            loading.style.display = 'none';
            result.style.display = 'block';
            overlay.style.display = 'flex';

            if (data.action === 'detect') {
                const isReal = data.result.toLowerCase().includes('real') || data.result.toLowerCase().includes('genuine');
                resultTitle.textContent = 'Detección de Autenticidad';
                resultIcon.innerHTML = `<i class="fas ${isReal ? 'fa-check-circle' : 'fa-times-circle'} fa-5x" style="color: ${isReal ? '#4ade80' : '#ff416c'};"></i>`;
                resultContent.innerHTML = `
                    <div class="result-info">
                        <h3 class="result-prediction">${data.result}</h3>
                        <p class="confidence">Confianza: ${data.confidence.toFixed(2)}%</p>
                        <p class="analysis">${data.details.analysis || 'Análisis completado exitosamente'}</p>
                    </div>
                `;
            } else if (data.action === 'identify') {
                const identified = data.details.identified;
                resultTitle.textContent = 'Identificación de Hablante';
                resultIcon.innerHTML = `<i class="fas fa-user-circle fa-5x" style="color: ${identified ? '#8E54E9' : '#aaa'};"></i>`;
                resultContent.innerHTML = `
                    <div class="result-info">
                        <h3 class="result-prediction">${data.result}</h3>
                        ${identified 
                            ? `<p class="confidence">Confianza: ${data.confidence.toFixed(2)}%</p>` 
                            : `<p class="no-match">${data.details.message || 'No se encontró coincidencia'}</p>`}
                    </div>
                `;
            }
        }

        function convertToWav() {
            const fileInput = document.getElementById('audio-file');
            const file = fileInput.files[0];

            if (!file) {
                showModal('error', 'Error', 'Por favor, selecciona un archivo de audio primero.');
                return;
            }

            // Validar formato de archivo
            const allowedFormats = ['.wav', '.mp3', '.ogg', '.flac', '.m4a', '.aac', '.opus', '.webm', '.wma'];
            const fileName = file.name.toLowerCase();
            const isValidFormat = allowedFormats.some(format => fileName.endsWith(format));
            
            if (!isValidFormat) {
                showModal('error', 'Formato no Permitido', 'Formato de archivo no permitido. Use: wav, mp3, ogg, flac, m4a, aac, opus, webm, wma');
                return;
            }

            // Mostrar modal con loading
            const overlay = document.getElementById('modal-overlay');
            const loading = document.getElementById('modal-loading');
            const result = document.getElementById('modal-result');
            
            overlay.style.display = 'flex';
            loading.style.display = 'block';
            result.style.display = 'none';
            loading.querySelector('p').textContent = 'Convirtiendo a WAV...';

            // Crear FormData para enviar el archivo
            const formData = new FormData();
            formData.append('file', file);

            // Enviar petición al backend FastAPI directamente
            fetch('http://localhost:8000/api/dl/convert-to-wav', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al convertir el archivo');
                }
                return response.blob();
            })
            .then(blob => {
                // Crear enlace de descarga
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                // Mantener el nombre original pero cambiar extensión a .wav
                const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                a.download = originalName + '.wav';
                
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                // Mostrar mensaje de éxito
                const resultIcon = document.getElementById('result-icon');
                const resultTitle = document.getElementById('result-title');
                const resultContent = document.getElementById('result-content');
                
                loading.style.display = 'none';
                result.style.display = 'block';
                
                resultTitle.textContent = 'Conversión Exitosa';
                resultIcon.innerHTML = '<i class="fas fa-check-circle fa-5x" style="color: #4ade80;"></i>';
                resultContent.innerHTML = `
                    <div class="result-info">
                        <h3 class="result-prediction">Archivo Convertido</h3>
                        <p class="analysis">El archivo se ha descargado como <strong>${originalName}.wav</strong></p>
                    </div>
                `;
                
                // Resetear texto del loading para próximas operaciones
                setTimeout(() => {
                    loading.querySelector('p').textContent = 'Analizando audio...';
                }, 500);
            })
            .catch(error => {
                showModal('error', 'Error de Conversión', error.message || 'No se pudo convertir el archivo. Verifica que el backend esté ejecutándose.');
                loading.querySelector('p').textContent = 'Analizando audio...';
            });
        }

        function resetForm() {
            document.getElementById('audio-file').value = '';
            document.getElementById('file-name-display').textContent = 'Ningún archivo seleccionado';
            document.getElementById('file-name-display').classList.remove('active');
        }
    </script>
</body>
